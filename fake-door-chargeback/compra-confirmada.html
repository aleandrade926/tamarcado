<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retorno do Checkout - Dossiê de Chargeback</title>
    <script src="config.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #09090b; color: #f4f4f5; text-align: center; padding: 100px 20px; }
        .btn { display: inline-block; padding: 16px 32px; border-radius: 9999px; background: #4f46e5; color: white; text-decoration: none; font-weight: bold; margin-top: 24px; }
        .alert { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); padding: 16px; border-radius: 8px; color: #ef4444; max-width: 500px; margin: 32px auto 0; font-size: 0.875rem; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            trackEvent('page_view');
            trackEvent('checkout_return_success');
        });
    </script>
</head>
<body>
    <h1 style="color: #10b981;">Retorno do checkout recebido</h1>
    <p style="color: #a1a1aa; max-width: 500px; margin: 0 auto;">Consulte seu comprovante e o painel do meio de pagamento para confirmar a conclusão. Após a confirmação financeira, enviaremos as instruções do piloto.</p>
    
    <div class="alert">
        <strong>Atenção:</strong> Esta página, isoladamente, não comprova pagamento.
    </div>

    <p style="margin-top: 40px;"><a href="index.html" style="color: #4f46e5;">Voltar ao início</a></p>
</body>
</html>
